const $=id=>document.getElementById(id);let screen='home',role='customer',shop='A',selected=1,filter='All',pending='',amount=0,previous='detail';let notes={};try{notes=JSON.parse(localStorage.getItem('layby-notes')||'{}')}catch(e){};const initial=[{id:1,item:'TV',icon:'📺',shop:'A',price:10,paid:6,fee:1,status:'Active',due:'2026-12-15T12:00',history:[['Created','Shop A opened agreement'],['Payment','6 AVAX instalment']]},{id:2,item:'Fridge',icon:'🧊',shop:'B',price:8,paid:2,fee:1,status:'Active',due:'2026-12-20T12:00',history:[['Created','Shop B opened agreement'],['Payment','2 AVAX instalment']]},{id:3,item:'Sofa',icon:'🛋️',shop:'A',price:6,paid:1,fee:1,status:'Active',due:'2026-11-28T10:00',expired:true,history:[['Created','Shop A opened agreement'],['Payment','1 AVAX instalment']]}];let data=structuredClone(initial);const fmt=n=>Number(n.toFixed(4)).toLocaleString('en-ZA')+' AVAX';const bal=x=>Math.max(0,x.price-x.paid);const fee=x=>Math.min(x.paid,x.price*x.fee/100);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const status=x=>x.status==='Active'&&x.expired?'Expiry due':x.status;const pill=x=>`<span class="tag ${x.status==='Completed'||x.status==='Collected'?'green':x.expired&&x.status==='Active'?'orange':x.status==='Active'?'':'gray'}">${status(x)}</span>`;const b=(label,action,cls='')=>`<button class="${cls}" onclick="${action}">${label}</button>`;const x=()=>data.find(a=>a.id===selected);function go(s){screen=s;render();window.scrollTo(0,0);if(!$('reviewbox').classList.contains('hidden'))review(true)}function choose(r){role=r;filter='All';go('dashboard')}function openId(id){selected=id;go('detail')}function layout(content){return `<div class="layout"><aside><p class="muted">${role==='customer'?'CUSTOMER':'SHOP '+shop}</p>${b('▦  '+(role==='customer'?'My lay-bys':'Shop dashboard'),"filter='All';go('dashboard')",screen==='dashboard'?'on':'')}${role==='shop'?b('+  Create lay-by',"go('create')",screen==='create'?'on':''):''}${b('◷  Activity',"go('activity')",screen==='activity'?'on':'')}${b('ⓘ  How it works',"go('how')",screen==='how'?'on':'')}${b('⇄  Switch demo wallet',"go('role')")}${b('↺  Reset demo',"resetDemo()")}</aside><main>${content}</main></div>`}function resetDemo(){data=structuredClone(initial);filter='All';go('home')}function render(){ $('wallet').textContent=screen==='home'||screen==='role'?'Connect wallet':(role==='customer'?'Customer · 0x…4e21':'Shop '+shop+' · 0x…9c10');let html='';if(screen==='home')html=`<div class="wrap"><section class="hero"><div><div class="eyebrow">A better way to lay-by</div><h1>Pay over time.<br>Collect with confidence.</h1><p>Keep every instalment in the right place. Track your lay-bys across shops, see the terms upfront and release funds when you collect.</p><div class="actions">${b('Get started  →',"go('role')")}${b('How it works',"go('how')",'secondary')}</div><p class="muted" style="margin-top:18px">Prototype on Avalanche Fuji · Test AVAX only</p></div><div class="visual"><div class="floating"><div class="actions"><div class="pic">📺</div><div><strong>Smart TV</strong><div class="muted">Shop A · Lay-by #1</div></div><span class="tag green">Active</span></div><p style="margin-top:20px">Your progress</p><div class="big">6 / 10 AVAX</div><div class="bar"><i style="width:60%"></i></div><div class="line"><span>Remaining</span><strong>4 AVAX</strong></div></div><div class="floating"><strong>◈  Funds held in smart contract</strong><div class="muted">Released when you confirm collection.</div></div></div></section><div class="grid"><div class="card"><h3>01 · One place</h3><p>See lay-bys from multiple partner shops.</p></div><div class="card"><h3>02 · Clear terms</h3><p>Know your fees, balance and expiry before paying.</p></div><div class="card"><h3>03 · Verifiable records</h3><p>Every payment has its own on-chain record.</p></div></div></div>`;
else if(screen==='role')html=`<div class="wrap"><div class="form"><button class="link" onclick="go('home')">← Home</button><h1>Choose your demo wallet</h1><p>For this prototype, switching roles simulates connecting a wallet. No real wallet connection is made.</p><div class="list"><div class="card"><h2>Customer</h2><p>View agreements across shops, pay instalments, cancel or confirm collection.</p>${b('Continue as customer',"choose('customer')")}</div><div class="card"><h2>Shop A</h2><p>Create agreements, monitor payments, cancel or expire eligible lay-bys.</p>${b('Continue as Shop A',"shop='A';choose('shop')")}</div><div class="card"><h2>Shop B</h2><p>See only agreements associated with this shop wallet.</p>${b('Continue as Shop B',"shop='B';choose('shop')")}</div></div></div></div>`;
else if(screen==='dashboard'){let rows=data.filter(a=>role==='customer'||a.shop===shop),shown=rows.filter(a=>filter==='All'||a.status===filter);html=layout(`<div class="top"><div><div class="eyebrow">Overview</div><h1>${role==='customer'?'My lay-bys':'Shop '+shop+' dashboard'}</h1><p>${role==='customer'?'All your agreements, across stores.':'Manage agreements and monitor escrow.'}</p></div>${role==='shop'?b('+ Create lay-by',"go('create')"):''}</div><div class="stats"><div class="card"><div class="muted">Total agreements</div><div class="big">${rows.length}</div></div><div class="card"><div class="muted">In escrow</div><div class="big">${fmt(rows.filter(a=>['Active','Completed'].includes(a.status)).reduce((s,a)=>s+a.paid,0))}</div></div><div class="card"><div class="muted">Ready to collect</div><div class="big">${rows.filter(a=>a.status==='Completed').length}</div></div></div><h2>Agreements</h2><div class="tabs">${['All','Active','Completed','Collected','Cancelled','Expired'].map(f=>b(f,`filter='${f}';render()`,filter===f?'':'secondary')).join('')}</div><div class="list">${shown.map(a=>`<div class="card item"><div class="pic">${a.icon}</div><div><strong>${esc(a.item)}</strong><div class="muted">Shop ${a.shop} · #${a.id}</div>${pill(a)}</div><div class="progress"><div class="small"><strong>${fmt(a.paid)}</strong> / ${fmt(a.price)}</div><div class="bar"><i style="width:${a.paid/a.price*100}%"></i></div><div class="muted">${fmt(bal(a))} remaining</div></div><div class="actions">${b('View details',`openId(${a.id})`,'secondary')}${role==='customer'&&a.status==='Active'&&!a.expired?b('Pay',`selected=${a.id};go('pay')`):''}</div></div>`).join('')||'<div class="card">No agreements in this category.</div>'}</div>`)}
else if(screen==='detail'){let a=x(),active=a.status==='Active',complete=a.status==='Completed';html=layout(`<button class="link" onclick="go('dashboard')">← All lay-bys</button><div class="top"><div><h1>${esc(a.item)}</h1><p>Shop ${a.shop} · Agreement #${a.id}</p></div>${pill(a)}</div><div class="detail"><div><div class="card"><div class="actions"><div class="pic">${a.icon}</div><div><h2>Payment progress</h2><div class="muted">Recorded instalments</div></div></div><div class="big" style="margin-top:20px">${fmt(a.paid)} <span class="muted">of ${fmt(a.price)}</span></div><div class="bar"><i style="width:${a.paid/a.price*100}%"></i></div><div class="line"><span>Remaining</span><strong>${fmt(bal(a))}</strong></div><div class="line"><span>Currently held in escrow</span><strong>${fmt(active||complete?a.paid:0)}</strong></div>${a.expired&&active?'<div class="notice warn">Payment window closed. Shop can settle expiry.</div>':''}<div class="actions" style="margin-top:18px">${role==='customer'&&active&&!a.expired?b('Pay instalment',"go('pay')"):''}${role==='customer'&&complete?b('Confirm collection',"pending='collect';go('confirm')"):''}${(role==='customer'&&active)||(role==='shop'&&(active||complete))?b('Cancel lay-by',"pending='cancel';go('confirm')",'danger'):''}${role==='shop'&&active&&a.expired?b('Settle expiry',"pending='expire';go('confirm')"):''}</div></div><div class="card" style="margin-top:16px"><h2>Activity timeline</h2>${a.history.map((h,i)=>`<div class="step"><div class="dot">${i+1}</div><div><strong>${h[0]}</strong><div class="muted">${esc(h[1])}</div></div></div>`).join('')}</div></div><div class="card"><h2>Agreement terms</h2>${[['Agreement ID','#'+a.id],['Shop wallet','Shop '+a.shop+' · demo'],['Customer wallet','0x…4e21 · demo'],['Full price',fmt(a.price)],['Cancellation fee',a.fee+'% of full price'],['Fee if customer cancels',fmt(fee(a))],['Completion date',a.due.replace('T',' ')],['Grace period','120 seconds (demo)'],['Network','Avalanche Fuji']].map(([k,v])=>`<div class="line"><span class="muted">${k}</span><strong class="small">${v}</strong></div>`).join('')}<div class="notice">Terms cannot be edited after creation. Shop cancellation refunds the full amount paid.</div><p class="muted">Explorer link will appear in the connected build.</p></div></div>`)}
else if(screen==='pay'){let a=x();html=layout(`<div class="form"><button class="link" onclick="go('detail')">← Agreement</button><h1>Pay an instalment</h1><p>Check the agreement before submitting your payment.</p><div class="card"><div class="actions"><div class="pic">${a.icon}</div><div><h2>${esc(a.item)} · #${a.id}</h2><p>Shop ${a.shop}</p></div></div><div class="line"><span>Remaining</span><strong>${fmt(bal(a))}</strong></div><div class="line"><span>Cancellation fee cap for this agreement</span><strong>${fmt(a.price*a.fee/100)}</strong></div><label class="field">Instalment amount (test AVAX)<input id="payamt" type="number" min="0.0001" step="any" max="${bal(a)}" placeholder="0.00"></label><div class="actions">${b('Pay full balance',`$('payamt').value=${bal(a)}`,'secondary')}</div><div class="notice">Paying accepts the agreement terms. Funds remain in escrow until collection or settlement.</div><label><input type="checkbox" id="accept"> I have reviewed the agreement and fee.</label><div id="err" style="color:#a33b36;margin:12px 0"></div>${b('Review payment  →','reviewPay()')}</div></div>`)}
else if(screen==='create')html=layout(`<div class="form"><button class="link" onclick="go('dashboard')">← Dashboard</button><h1>Create lay-by</h1><p>Set the agreement terms. They cannot be edited after creation.</p><div class="card"><label class="field">Customer wallet address<input id="customer" value="0x1111111111111111111111111111111111111111"></label><label class="field">Item label<input id="item" placeholder="e.g. Washing machine"></label><label class="field">Full price (test AVAX)<input id="price" type="number" min="0.0001" step="any" placeholder="0.00"></label><label class="field">Cancellation fee (%)<input id="fee" type="number" min="0" max="1" step="0.01" value="1"></label><label class="field">Anticipated completion date<input id="due" type="datetime-local" value="2026-12-15T12:00"></label><div class="notice">Expiry = completion date + 120 seconds in this demo. A shop cancellation has no fee.</div><p id="err" style="color:#a33b36"></p>${b('Review agreement  →','reviewCreate()')}</div></div>`);
else if(screen==='confirm'){let a=x(),isCreate=pending==='create',title={pay:'Review payment',create:'Review new agreement',collect:'Confirm collection',cancel:'Confirm cancellation',expire:'Settle expired agreement'}[pending];let full=role==='shop'&&pending==='cancel',f=full?0:fee(a||draft),refund=a?a.paid-f:0;html=layout(`<div class="form"><button class="link" onclick="go('${isCreate?'create':pending==='pay'?'pay':'detail'}')">← Back</button><h1>${title}</h1><p>Review the details before simulating the wallet signature.</p><div class="card"><h2>${esc(isCreate?draft.item:a.item)} ${isCreate?'':'· #'+a.id}</h2>${isCreate?`<div class="line"><span>Customer</span><strong class="small">${esc(draft.customer.slice(0,8))}…${esc(draft.customer.slice(-4))}</strong></div><div class="line"><span>Full price</span><strong>${fmt(draft.price)}</strong></div><div class="line"><span>Fee</span><strong>${draft.fee}%</strong></div><div class="line"><span>Completion date</span><strong>${draft.due.replace('T',' ')}</strong></div>`:pending==='pay'?`<div class="line"><span>Instalment</span><strong>${fmt(amount)}</strong></div><div class="line"><span>New remaining balance</span><strong>${fmt(bal(a)-amount)}</strong></div>`:pending==='collect'?`<div class="notice warn">Only confirm after physically receiving your item. This releases all escrowed funds to the shop.</div><div class="line"><span>Released to shop</span><strong>${fmt(a.price)}</strong></div><label><input id="received" type="checkbox"> I have received my item.</label>`:`<div class="line"><span>Total paid</span><strong>${fmt(a.paid)}</strong></div><div class="line"><span>Fee to shop</span><strong>${fmt(f)}</strong></div><div class="line"><span>Refund to customer</span><strong>${fmt(refund)}</strong></div><div class="notice warn">This closes the agreement permanently.</div>`}<div class="notice">Simulated transaction · No real funds · Network gas not calculated.</div><p id="err" style="color:#a33b36"></p>${b('Simulate wallet confirmation','execute()')}</div></div>`)}
else if(screen==='receipt')html=layout(`<div class="form"><div class="card" style="text-align:center;padding:40px"><div style="font-size:48px;color:#278451">✓</div><h1>Transaction successful</h1><p>${receipt}</p><div class="notice">Simulation only. No blockchain transaction was broadcast.</div><div class="actions" style="justify-content:center">${b('View agreement',"go('detail')")}${b('Back to dashboard',"go('dashboard')",'secondary')}</div></div></div>`);
else if(screen==='activity'){let rows=data.filter(a=>role==='customer'||a.shop===shop);html=layout(`<h1>Activity</h1><p>Agreement events for the selected demo wallet.</p><div class="card">${rows.flatMap(a=>a.history.map(h=>`<div class="line"><div><strong>${h[0]} · ${esc(a.item)}</strong><div class="muted">${esc(h[1])}</div></div><button class="link" onclick="openId(${a.id})">#${a.id} →</button></div>`)).join('')}</div>`)}
else if(screen==='how')html=`<div class="wrap"><button class="link" onclick="go('home')">← Home</button><h1>How Lay-by Smart works</h1><p>One agreement ID. Clear terms. Verifiable payments.</p><div class="grid">${[['1','Shop creates an agreement','Price, customer wallet, fee and completion date are set.'],['2','Customer pays instalments','Payments reference the specific agreement ID.'],['3','Funds stay in escrow','The shop cannot withdraw instalments early.'],['4','Customer collects','Customer confirms receipt and releases the funds.'],['5','Cancellation','Customer cancellation while active can incur the disclosed fee. Shop cancellation refunds all paid funds.'],['6','Expiry','After the grace period, payment stops and the shop can settle the agreement.']].map(([n,t,d])=>`<div class="card"><span class="dot">${n}</span><h2 style="margin-top:12px">${t}</h2><p>${d}</p></div>`).join('')}</div><div class="notice warn">Testnet prototype, not legal advice. No real money or personal information. Physical delivery cannot be independently verified by the contract.</div>${b('Try the demo',"go('role')")}</div>`; $('app').innerHTML=html+'<div class="foot">Lay-by Smart · Interactive design prototype · Avalanche Fuji · Simulated data</div>'}
let draft,receipt='';function reviewPay(){let a=x();amount=Number($('payamt').value);if(!Number.isFinite(amount)||amount<=0||amount>bal(a)+1e-9){$('err').textContent='Enter a positive amount no greater than the remaining balance.';return}if(!$('accept').checked){$('err').textContent='Please review and accept the agreement terms.';return}pending='pay';go('confirm')}function reviewCreate(){let customer=$('customer').value.trim(),item=$('item').value.trim(),price=Number($('price').value),f=Number($('fee').value),due=$('due').value;if(!/^0x[0-9a-fA-F]{40}$/.test(customer)||!item||!Number.isFinite(price)||price<=0||!Number.isFinite(f)||f<0||f>1||Math.abs(f*100-Math.round(f*100))>1e-8||!due||new Date(due)<=new Date('2026-11-28T11:21:00')){$('err').textContent='Use a valid wallet, item, positive price, fee from 0 to 1% in 0.01% increments and a future date.';return}draft={customer,item,price,fee:f,due,shop,icon:'📦',paid:0,status:'Active',history:[['Created','Shop '+shop+' opened agreement']]};pending='create';go('confirm')}function execute(){let a=x();if(pending==='create'){draft.id=Math.max(...data.map(i=>i.id))+1;data.push(draft);selected=draft.id;receipt='Agreement #'+selected+' created.'}else if(pending==='pay'){a.paid=Math.min(a.price,+(a.paid+amount).toFixed(10));a.history.push(['Payment',fmt(amount)+' instalment']);if(bal(a)<1e-9){a.status='Completed';a.history.push(['Completed','Ready for collection'])}receipt=fmt(amount)+' recorded on agreement #'+a.id+'.'}else if(pending==='collect'){if(!$('received').checked){$('err').textContent='Confirm that you physically received the item.';return}a.status='Collected';a.history.push(['Collected',fmt(a.price)+' released to shop']);receipt='Collection confirmed and funds released in the simulation.'}else{let f=role==='shop'&&pending==='cancel'?0:fee(a);a.status=pending==='expire'?'Expired':'Cancelled';a.history.push([a.status,fmt(a.paid-f)+' refunded; '+fmt(f)+' fee']);receipt='Agreement closed. Refund '+fmt(a.paid-f)+'.'}go('receipt')}
function review(refresh=false){let el=$('reviewbox');if(!refresh&&!el.classList.contains('hidden')){el.classList.add('hidden');return}let key=screen+(['dashboard','detail','activity','confirm','receipt'].includes(screen)?'-'+role:'')+(screen==='confirm'?'-'+pending:'');el.classList.remove('hidden');el.innerHTML=`<div class="top" style="margin-bottom:8px"><strong>Feedback · ${key}</strong><button class="link" onclick="review()">✕</button></div><textarea id="note" placeholder="What should change on this screen?">${esc(notes[key]||'')}</textarea><div class="actions" style="margin-top:9px">${b('Save feedback',`saveNote('${key}')`)}${b('Export all notes','exportNotes()','secondary')}</div><p class="muted" style="margin-top:10px">Stored in this browser only.</p>`}function saveNote(k){notes[k]=$('note').value;try{localStorage.setItem('layby-notes',JSON.stringify(notes))}catch(e){}let t=document.createElement('div');t.className='toast';t.textContent='Feedback saved';document.body.append(t);setTimeout(()=>t.remove(),1600)}function exportNotes(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([Object.entries(notes).map(([k,v])=>k+'\n'+v).join('\n\n')],{type:'text/plain'}));a.download='layby-feedback.txt';a.click();URL.revokeObjectURL(a.href)}render();
</script></body></html>
